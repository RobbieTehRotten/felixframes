name: Run Frame Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Bot Script
      run: python bot.py

    - name: Commit, Push and Loop Trigger
      env:
        GITHUB_TOKEN: ${{ secrets.BOT_LOOP_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add frame_counter.txt
        if ! git diff-index --quiet HEAD; then
          git commit -m "🤖 Auto-increment frame counter"
          git push
          sleep 300
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" https://github.com{{ github.repository }}/actions/workflows/frame_bot.yml/dispatches -d '{"ref":"main"}'
        fi
