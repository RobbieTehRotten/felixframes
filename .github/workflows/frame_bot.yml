name: Run Frame Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Prevent overlapping runs from posting the same frame
concurrency:
  group: frame-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless atproto

      - name: Run Bot Script
        continue-on-error: true
        env:
          BSKY_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python bot.py

      - name: Commit, Push and Loop Trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add frame_counter.txt

          # Commit only if the frame counter changed
          if ! git diff --cached --quiet; then
            git commit -m "Auto-increment frame counter"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Frame was not posted. Will retry the same frame next cycle."
          fi

          # Wait before triggering the next cycle
          echo "Waiting 150 seconds before the next cycle..."
          sleep 150

          # Retry transient GitHub API errors
          echo "Triggering the next workflow run..."

          curl --fail-with-body -sS -L \
            --retry 5 \
            --retry-delay 10 \
            --retry-max-time 120 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/frame_bot.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Workflow dispatch request succeeded."
