name: Run Frame Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Video Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python atproto requests

    - name: Run Bot Script
      run: python bot.py

    - name: Commit and Push updated frame status
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add frame_counter.txt
        git diff-index --quiet HEAD || (git commit -m "🤖 Auto-increment frame counter" && git push)
