name: Run Frame Bot

on:
  schedule:
    # Trigger automatically every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to manually click the test button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Upgraded to resolve the Google Core deprecation warning

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: python bot.py
