name: Run Frame Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Prevent overlapping runs
concurrency:
  group: frame-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless atproto

      - name: Run Bot Script
        continue-on-error: true
        env:
          BSKY_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python bot.py

      - name: Commit, Push and Loop Trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add frame_counter.txt

          # Commit only if the frame counter changed
          if ! git diff --cached --quiet; then

            git commit -m "Auto-increment frame counter"

            # Retry GitHub pushes up to five times
            PUSH_SUCCESS=false

            for attempt in 1 2 3 4 5; do
              echo "Git push attempt $attempt of 5..."

              # Refresh remote state before each attempt
              if ! git fetch origin main; then
                echo "Git fetch failed. Will retry."

              elif ! git rebase FETCH_HEAD; then
                echo "Rebase failed. Stopping to prevent counter conflicts."
                git rebase --abort || true
                exit 1

              elif git push origin HEAD:main; then
                echo "Counter successfully pushed to GitHub!"
                PUSH_SUCCESS=true
                break

              else
                echo "Git push failed. Will retry."
              fi

              if [ "$attempt" -lt 5 ]; then
                WAIT_TIME=$((attempt * 15))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep "$WAIT_TIME"
              fi
            done

            # Stop if the counter could not be saved
            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "::error::Failed to push frame counter after five attempts."
              echo "Stopping to prevent the next cycle from reposting a frame."
              exit 1
            fi

          else
            echo "Frame was not posted. Will retry the same frame next cycle."
          fi

          # Wait before triggering the next cycle
          echo "Waiting 150 seconds before the next cycle..."
          sleep 150

          # Trigger the next workflow run with retries
          echo "Triggering the next workflow run..."

          curl --fail-with-body -sS -L \
            --retry 5 \
            --retry-delay 10 \
            --retry-max-time 120 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/frame_bot.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Next workflow dispatch request succeeded."
