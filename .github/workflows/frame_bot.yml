name: Run Frame Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Backup trigger in case the loop ever breaks
  workflow_dispatch:     # Manual trigger button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Video Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python atproto requests

    - name: Run Bot Script
      run: python bot.py

    - name: Commit, Push and Loop Trigger
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add frame_counter.txt
        
        # If a frame was posted, commit it and immediately queue up the next run
        if ! git diff-index --quiet HEAD; then
          git commit -m "🤖 Auto-increment frame counter"
          git push
          
          echo "🔄 Instantly triggering the next 5-minute queue cycle..."
          sleep 300 # Forces a clean 5-minute wait (300 seconds) inside the cloud runner
          
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/actions/workflows/frame_bot.yml/dispatches \
            -d '{"ref":"main"}'
        fi
        fi
